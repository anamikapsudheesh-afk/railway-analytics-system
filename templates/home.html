<!DOCTYPE html>
<html>
<head>
    
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;

            background:
            linear-gradient(rgba(0,0,0,0.45),
            rgba(0,0,0,0.55)),
            url("/static/images/hero.jpg");

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            color:white;
        }

        .navbar{
            width:100%;
            padding:25px 60px;

            display:flex;
            justify-content:space-between;
            align-items:center;

            background:rgba(0,0,0,0.70);
            backdrop-filter:blur(6px);
        }

        .logo{
            font-size:42px;
            font-weight:bold;
            color:#f5c76f;
        }

        .nav-links{
            display:flex;
            gap:40px;
        }

        .nav-links a{
            color:white;
            text-decoration:none;
            font-size:22px;
            transition:0.3s;
        }

        .nav-links a:hover{
            color:#f5c76f;
        }

        .hero{
            min-height:85vh;

            display:flex;
            justify-content:center;
            align-items:center;

            text-align:center;
            padding:40px;
        }

        .hero-content{
            background:rgba(0,0,0,0.45);

            padding:70px;
            border-radius:30px;

            backdrop-filter:blur(4px);
        }

        .hero-content h1{
            font-size:72px;
            line-height:1.2;

            color:#f5c76f;

            font-weight:700;

            margin-bottom:50px;

            text-shadow:0 4px 20px rgba(0,0,0,0.6);
        }

        .hero-buttons{
            display:flex;
            justify-content:center;
            gap:25px;
        }

        .hero-buttons a{
            text-decoration:none;

            background:#d4a74f;
            color:black;

            padding:16px 34px;

            border-radius:12px;

            font-size:20px;
            font-weight:bold;

            transition:0.3s;
        }

        .hero-buttons a:hover{
            transform:translateY(-3px);
            background:#f5c76f;
        }

    </style>
</head>

<body>

    <div class="navbar">

        <div class="logo">
            <div class="logo">Railway Analytics System</div>
        </div>

        <div class="nav-links">
            <a href="/home">Home</a>
           <a href="/dashboard">Analytics Dashboard</a>
<a href="/smart-search">Route Finder</a>
            <a href="/logout">Logout</a>
        </div>

    </div>

    <section class="hero">

        <div class="hero-content">

            <h1>
                <h1>
    Railway Analytics System
</h1>
            </h1>

            <div class="hero-buttons">

                <a href="/dashboard">Analytics Dashboard</a>
                </a>

                <a href="/smart-search">Route Finder</a>
                </a>

            </div>

        </div>

    </section>

</body>
</html>
