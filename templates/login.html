<!DOCTYPE html>
<html>
<head>
    <title>Login | RailConnect Intelligence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
            linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
            url('https://images.unsplash.com/photo-1474487548417-781cb71495f3?q=80&w=2070');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: rgba(10,20,40,0.9);
            padding: 40px;
            border-radius: 15px;
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            border: none;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Login</h1>

        <form method="POST">
            <input type="email" name="email" placeholder="Enter Email" required>
            <input type="password" name="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>

        <p>No account? <a href="/register">Register</a></p>
    </div>
</body>
</html>
